# Render Blueprint: one free web service. Deploy from the Render dashboard with
# New > Blueprint and pick this repo. You'll be asked for GROQ_API_KEY (optional:
# without it the app runs on the rule-based parser).
services:
  - type: web
    name: spacescout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
